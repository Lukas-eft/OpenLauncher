[package]
name = "openlauncher"
version = "0.1.0"
description = "OpenLauncher – 100 % reine Rust-Desktop-App für Windows & Linux"
authors = ["OpenLauncher Contributors"]
edition = "2021"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["file", "http", "image", "webp", "gif"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tga"] }
rfd = "0.17"
tray-icon = "0.25"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "7"
thiserror = "2"
open = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
